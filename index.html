import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getDatabase,ref,set,onValue,get,update}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAnnKbcwMhahNIPgi4Kc-vlrjIjohTcMdg",authDomain:"f1-team-23439.firebaseapp.com",databaseURL:"https://f1-team-23439-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"f1-team-23439",storageBucket:"f1-team-23439.firebasestorage.app",messagingSenderId:"958691507990",appId:"1:958691507990:web:eb0fa15f924185f80d1a37",measurementId:"G-F2MG0RE5TW"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),pts=[25,18,15,12,10,8,6,4];let uid=null,roomId=null,roomData=null,isHost=false,selected=0,mode="2x4";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rankScore(r){return r>=1&&r<=8?pts[r-1]:0}
function practiceGames(){return Number(roomData?.practiceCount||3)}
function practiceTotals(){let p=players(),out=Array(8).fill(0);for(let g=0;g<practiceGames();g++){let r=roomData?.practice?.[g]?.ranks||{};for(let i=0;i<8;i++)out[i]+=rankScore(Number(r[i]))}return out}
function finalPracticeRanking(){
  let p=players(),t=practiceTotals(),last=practiceGames()-1;
  return p.map((x,i)=>{
    let lastRank=Number(roomData?.practice?.[last]?.ranks?.[i]);
    let best=99;
    for(let g=0;g<practiceGames();g++){let r=Number(roomData?.practice?.[g]?.ranks?.[i]);if(r>=1&&r<=8)best=Math.min(best,r)}
    return {x,i,total:t[i],lastRank:(lastRank>=1&&lastRank<=8)?lastRank:99,best};
  }).sort((a,b)=>{

function teamForRank(pos){if(mode==="2x4")return [1,4,5,8].includes(pos)?"Ferrari":"Red Bull";return [1,8].includes(pos)?"Ferrari":([2,7].includes(pos)?"Red Bull":([3,6].includes(pos)?"McLaren":"Mercedes"))}
function assignedPlayers(){
  let p=players(),rank=finalPracticeRanking();

}
function allPracticeDone(){for(let g=0;g<practiceGames();g++){let r=roomData?.practice?.[g]?.ranks||{};let vals=Array.from({length:8},(_,i)=>Number(r[i]));if(vals.some(x=>x<1||x>8)||new Set(vals).size!==8)return false}return true}
function totals(){let out=Array(8).fill(0),p=players();for(let g=0;g<5;g++){let r=roomData?.races?.[g];if(!r?.finished)continue;for(let i=0;i<8;i++){let pos=Number(r.ranks?.[i]);out[i]+=rankScore(pos)+(r.fastestLap&&pos===1?1:0)}}return out}
function teamCountback(team,p=assignedPlayers()){

    let r=roomData?.races?.[g];

function compareTeam(a,b){

}
function practiceCompletedGames(){let n=practiceGames();return Array.from({length:n},(_,g)=>roomData?.practice?.[g]?.ranks||{}).filter(r=>Object.values(r).length===8&&Object.values(r).every(x=>x>=1&&x<=8)&&new Set(Object.values(r)).size===8).length}
function renderPractice(){let n=practiceGames(),p=players(),finished=!!roomData?.practiceFinished;$("practiceGuide").textContent=finished?`연습 종료 · ${practiceCompletedGames()}경기 반영 / 총 ${n}경기 설정`: `선수 이름은 한 번만 입력합니다. 아래 각 연습경기의 순위에 같은 이름이 자동으로 표시됩니다. 누적점수로 1~8위를 결정합니다.`;let names=`<div class="practice-game"><h3>👤 선수 이름</h3><div class="grid8"><b>이름</b><b></b><b></b>${p.map((x,i)=>`<input data-pn="${i}" value="${esc(x.name)}" placeholder="이름"><span></span><span></span>`).join("")}</div></div>`;let games=Array.from({length:n},(_,g)=>{let r=roomData?.practice?.[g]?.ranks||{};return `<div class="practice-game"><h3>연습 ${g+1} / ${n}</h3><div class="grid8"><b>선수</b><b>순위</b><b>점수</b>${p.map((x,i)=>`<b class="practice-player-name" data-player-name="${i}">${esc(x.name||"선수 "+(i+1))}</b><input data-pr="${g}-${i}" type="number" min="1" max="8" value="${r[i]||""}" placeholder="순위"><b>${rankScore(Number(r[i]))||"-"}</b>`).join("")}</div></div>`}).join("");$("practiceArea").innerHTML=names+games;$("savePractice").disabled=!isHost||finished;$("finishPractice").disabled=!isHost||finished;document.querySelectorAll("[data-pr]").forEach(e=>e.disabled=!isHost||finished);document.querySelectorAll("[data-pn]").forEach(e=>e.disabled=!isHost||finished)}

}
function renderRace(){let p=assignedPlayers(),rs=roomData?.races||{};$("raceList").innerHTML=Array.from({length:5},(_,i)=>{let done=!!rs[i]?.finished;return `<div class="race-card ${i===selected?"current ":""}${done?"done":""}" data-r="${i}"><div class="race-head"><span>Race ${i+1}</span><span class="badge ${done?"done":""}">${done?"🏁 종료":i===selected?"진행 중":"대기"}</span></div>${done?`<div class="mini" style="margin-top:5px">${summary(i)}</div>`:""}</div>`}).join("");document.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{selected=+e.dataset.r;renderRace()});let r=rs[selected]||{};$("raceTitle").textContent=`Race ${selected+1}`;$("raceRows").innerHTML=p.map((x,i)=>`<div><b>${esc(x.name||"선수 "+(i+1))}</b><div class="mini ${cls(x.team)}">${esc(x.team||"-")}</div></div><input data-rr="${i}" type="number" min="1" max="8" value="${r.ranks?.[i]||""}" placeholder="순위"><div class="score" id="sc${i}">-</div>`).join("");$("fastestLap").checked=!!r.fastestLap;let prev=selected?rs[selected-1]:null;if(!selected){$("previous").innerHTML=`<div class="mini">첫 번째 레이스입니다.</div>`}else if(prev?.finished){let top=Object.entries(prev.ranks||{}).map(([idx,pos])=>({i:Number(idx),pos:Number(pos)})).filter(q=>q.pos>=1&&q.pos<=8).sort((a,b)=>a.pos-b.pos).slice(0,3);$("previous").innerHTML=`<b>이전 Race ${selected} TOP 3</b><div class="history">${top.map(q=>{let x=p[q.i]||{};let team=x.team||"-";let score=rankScore(q.pos)+(prev.fastestLap&&q.pos===1?1:0);return `<div class="hist"><b>${q.pos===1?"🥇":q.pos===2?"🥈":"🥉"} ${esc(x.name||"선수 "+(q.i+1))}</b> <span class="${cls(team)}">[${esc(team)}]</span> · ${score}점</div>`}).join("")}</div>`}else{$("previous").innerHTML=`<div class="mini">이전 Race ${selected}가 아직 종료되지 않았습니다.</div>`}preview();let done=!!r.finished;$('raceBadge').textContent=done?'🏁 종료':'진행 중';$('raceBadge').className='badge '+(done?'done':'');$('finishRace').disabled=!isHost||done;$('endGame').disabled=!isHost||!!roomData?.gameFinished;$('reopenRace').disabled=!isHost||!done;$('saveRace').disabled=!isHost||done;document.querySelectorAll('[data-rr]').forEach(e=>e.disabled=!isHost||done);$('fastestLap').disabled=!isHost||done}
function preview(){document.querySelectorAll('[data-rr]').forEach((e,i)=>{let r=+e.value;$('sc'+i).textContent=rankScore(r)+( $('fastestLap').checked&&r===1?1:0)||'-'})}
function sortedIndividual(){let p=assignedPlayers(),t=totals();return p.map((x,i)=>({x,total:t[i],i})).sort((a,b)=>b.total-a.total)}
function renderBoard(){
  let p=assignedPlayers(),t=totals();
  let groups=teamNames().map(n=>({
    name:n,
    members:p.map((x,i)=>({x,total:t[i]})).filter(q=>q.x.team===n),
    score:p.reduce((s,x,i)=>s+(x.team===n?t[i]:0),0),
    countback:teamCountback(n,p)
  })).sort(compareTeam);
  let finished=!!roomData?.gameFinished;
  let tied=groups.length>1&&compareTeam(groups[0],groups[1])===0;
  $('champion').innerHTML=finished?(tied?`<div class="champion"><div class="cup">⚖️</div><div class="winner">동점 · 추가 레이스 필요</div><b>${groups[0].score}점</b><div class="mini" style="margin-top:6px">1~8위 횟수까지 모두 동일합니다.</div></div>`:`<div class="champion"><div class="cup">🏆</div><div class="winner">${groups[0].name} 우승!</div><b>${groups[0].score}점</b><div class="mini" style="margin-top:6px">동점 시 1위 → 2위 → … → 8위 횟수 순으로 판정</div></div>`):'';
  $('teams').innerHTML=groups.map(g=>`<div class="teambox ${cls(g.name)}"><b class="${cls(g.name)}">${g.name}</b><div class="big">${g.score}</div><span class="mini">누적점수</span>${g.score===groups[0].score?`<div class="mini" style="margin-top:5px">${countbackText(g)}</div>`:''}</div>`).join('');
  let ranking=sortedIndividual(),heads=`<tr><th>순위</th><th>이름</th><th>팀</th>${[1,2,3,4,5].map(i=>`<th>R${i}</th>`).join('')}<th>총점</th></tr>`,rows=ranking.map((q,ri)=>{let cells=[1,2,3,4,5].map(n=>{let r=roomData?.races?.[n-1],pos=Number(r?.ranks?.[q.i]);return `<td>${r?.finished?rankScore(pos)+(r.fastestLap&&pos===1?1:0):"-"}</td>`}).join('');return `<tr><td>${ri+1}</td><td>${esc(q.x.name)}</td><td class="${cls(q.x.team)}">${esc(q.x.team)}</td>${cells}<td><b>${q.total}</b></td></tr>`}).join('');
  $('overall').innerHTML=`<div class="notice"><b>동점 판정 기준</b><br>팀 총점이 같으면 <b>1위 횟수 → 2위 횟수 → 3위 횟수 → … → 8위 횟수</b> 순으로 비교합니다. 8위까지 모두 같으면 추가 1레이스로 결정합니다.</div><table><thead>${heads}</thead><tbody>${rows}</tbody></table>`;
  $('history').innerHTML=Array.from({length:5},(_,i)=>`<div class="hist"><b>Race ${i+1}</b>　${roomData?.races?.[i]?.finished?"🏁 종료":"대기"}<div class="mini">${summary(i)}</div></div>`).join('');
  $('finalBtn').disabled=!finished;
}
function summary(i){let r=roomData?.races?.[i],p=assignedPlayers();if(!r?.finished)return "미기록";return p.map((x,j)=>({x,pos:Number(r.ranks?.[j])})).filter(q=>q.pos).sort((a,b)=>a.pos-b.pos).slice(0,3).map(q=>`${q.pos}위 ${esc(q.x.name)} [${esc(q.x.team)}]`).join(" · ")}
function renderFinal(){
  let p=assignedPlayers(),t=totals();
  let groups=teamNames().map(n=>({name:n,members:p.map((x,i)=>({x,total:t[i]})).filter(q=>q.x.team===n),score:p.reduce((s,x,i)=>s+(x.team===n?t[i]:0),0),countback:teamCountback(n,p)})).sort(compareTeam);
  let tied=groups.length>1&&compareTeam(groups[0],groups[1])===0,ind=sortedIndividual();
  $('finalCard').classList.remove('hidden');
  $('finalCard').innerHTML=`<h2>🏁 F1 TEAM RACE · FINAL</h2><div class="final-sub">${mode==='2x4'?'2 TEAM × 4 PLAYERS':'4 TEAM × 2 PLAYERS'} · ${[0,1,2,3,4].filter(i=>roomData?.races?.[i]?.finished).length} RACES</div><div class="final-winner"><div class="cup">${tied?'⚖️':'🏆'}</div><b>${tied?'동점 · 추가 레이스 필요':groups[0].name}</b><div>${groups[0].score}점 · ${tied?'1~8위 횟수까지 동일':'우승'}</div></div><div class="final-teams">${groups.map((g,idx)=>`<div class="final-team"><h3 class="${cls(g.name)}">${idx===0&&!tied?'🥇 ':''}${g.name}</h3><div class="pts">${g.score}점</div><div style="font-size:10px;color:#666;margin:2px 0 5px">${countbackText(g)}</div><ol>${g.members.sort((a,b)=>b.total-a.total).map(q=>`<li>${esc(q.x.name)} — ${q.total}점</li>`).join('')}</ol></div>`).join('')}</div><div class="final-individual"><b>개인 최종 순위</b>${ind.map((q,i)=>`<div><span>${i+1}. ${esc(q.x.name)} <span class="${cls(q.x.team)}">[${esc(q.x.team)}]</span></span><b>${q.total}</b></div>`).join('')}</div><div class="final-note">동점 판정: 팀 총점 → 1위 횟수 → 2위 횟수 → … → 8위 횟수 · 모두 같으면 추가 1레이스</div>`;
  $('finalCard').scrollIntoView({behavior:'smooth',block:'start'});
}
function render(){mode=roomData?.mode||'2x4';renderPractice();renderTeams();renderRace();renderBoard();$('roomInfo').textContent=`${mode==='2x4'?'2팀 × 4명 · Ferrari vs Red Bull':'4팀 × 2명 · Ferrari / Red Bull / McLaren / Mercedes'} · 연습 ${practiceGames()}경기`;$('hostMsg').textContent=isHost?'현재 기기: HOST (입력 가능)':'현재 기기: 참가자 (보기 전용)'}
async function enter(id){id=id.toUpperCase().trim();if(!/^[A-Z0-9]{6}$/.test(id))return $('lobbyMsg').textContent='6자리 방 코드를 확인해주세요.';let s=await get(ref(db,'rooms/'+id));if(!s.exists())return $('lobbyMsg').textContent='존재하지 않는 방입니다.';roomId=id;roomData=s.val();isHost=roomData.hostUid===uid;mode=roomData.mode||'2x4';$('lobby').classList.add('hidden');$('roomView').classList.remove('hidden');$('roomCode').textContent=id;localStorage.setItem('f1Room',id);onValue(ref(db,'rooms/'+id),s=>{if(!s.exists())return location.reload();roomData=s.val();isHost=roomData.hostUid===uid;render()})}
async function presetNames(){
  if(!isHost)return;
  if(roomData?.practiceFinished)return alert("연습이 종료된 후에는 이름을 변경할 수 없습니다.");
  if(!confirm("8명의 이름을 자동으로 등록할까요?\n\n1. 성원경\n2. 허우석\n3. 백종유\n4. 권혁성\n5. 송지훈\n6. 송지은\n7. 김재겸\n8. 배병관"))return;
  let p=players().map((x,i)=>({...x,name:DEFAULT_NAMES[i]}));
  await update(ref(db,"rooms/"+roomId),{players:p});
  let fresh=await get(ref(db,"rooms/"+roomId));
  if(fresh.exists())roomData=fresh.val();
  render();
}

async function create(){let id=Math.random().toString(36).slice(2,8).toUpperCase();while((await get(ref(db,'rooms/'+id))).exists())id=Math.random().toString(36).slice(2,8).toUpperCase();let m=mode,c=Number($('practiceCount').value);await set(ref(db,'rooms/'+id),{hostUid:uid,mode:m,practiceCount:c,players:empty(),practice:{},races:{},gameFinished:false,createdAt:Date.now()});enter(id)}
async function savePractice(finish=false){
  if(!isHost||roomData?.practiceFinished)return;
  try{
    let p=players().map((x,i)=>({...x,name:document.querySelector(`[data-pn="${i}"]`)?.value.trim()||x.name}));
    let upd={players:p};
    let completed=0;
    for(let g=0;g<practiceGames();g++){
      let ranks={};
      for(let i=0;i<8;i++) ranks[i]=Number(document.querySelector(`[data-pr="${g}-${i}"]`)?.value)||'';
      let vals=Object.values(ranks);
      let hasAny=vals.some(x=>x>=1&&x<=8);
      if(hasAny&&(vals.some(x=>x<1||x>8)||new Set(vals).size!==8)) return alert(`연습 ${g+1}의 1~8위를 중복 없이 모두 입력해주세요.`);
      if(vals.every(x=>x>=1&&x<=8)&&new Set(vals).size===8){upd[`practice/${g}/ranks`]=ranks;completed++;}
    }
    if(!completed)return alert('최소 1개의 연습경기 결과를 입력해주세요.');

    // 현재 입력값을 먼저 로컬 상태에 반영한 뒤 최종 순위를 계산한다.
    let fake={...roomData,players:p,practice:{...(roomData.practice||{})}};
    for(let g=0;g<practiceGames();g++) if(upd[`practice/${g}/ranks`]) fake.practice[g]={ranks:upd[`practice/${g}/ranks`]};
    roomData=fake;

    if(finish){
      // Firebase update()에서는 players 전체 경로와 players/0/team 같은 하위 경로를
      // 동시에 업데이트할 수 없으므로, 팀 배정까지 반영한 players 배열을 한 번에 저장한다.
      let rank=finalPracticeRanking();
      rank.forEach((q,i)=>{p[q.i]={...p[q.i],team:teamForRank(i+1)};});
      upd.players=p;
      upd.practiceFinished=true;
    }

    await update(ref(db,'rooms/'+roomId),upd);
    let fresh=await get(ref(db,'rooms/'+roomId));
    if(!fresh.exists()) throw new Error('방 데이터를 다시 불러오지 못했습니다.');
    roomData=fresh.val();
    mode=roomData.mode||'2x4';
    isHost=roomData.hostUid===uid;
    render();
    if(finish){
      // 연습 종료 후 결과 화면으로 확실히 전환
      document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));
      const practiceTab=document.querySelector('[data-tab="practice"]');
      if(practiceTab){practiceTab.classList.remove('hidden');practiceTab.classList.add('active');}
      $('practice').classList.remove('hidden');
      $('practiceInputCard').classList.add('hidden');
      $('practiceTeamCard').classList.add('hidden');
      $('practiceResultCard').classList.remove('hidden');
      $('practiceResultCard').scrollIntoView({behavior:'smooth',block:'start'});
    }
  }catch(e){
    console.error(e);
    alert('연습 종료 처리 중 오류가 발생했습니다.\n'+(e?.message||e));
  }
}
async function saveRace(finish=false){if(!isHost)return;let currentPlayers=players();let ins=[...document.querySelectorAll('[data-rr]')],nums=ins.map(x=>+x.value);if(finish&&(nums.some(n=>n<1||n>8)||new Set(nums).size!==8))return alert('1~8위를 중복 없이 모두 입력해주세요.');let ranks={};ins.forEach((x,i)=>{if(x.value)ranks[i]=+x.value});await update(ref(db,`rooms/${roomId}`),{players:currentPlayers,[`races/${selected}`]:{ranks,fastestLap:$('fastestLap').checked,finished:finish,finishedAt:finish?Date.now():null}});let fresh=await get(ref(db,'rooms/'+roomId));if(fresh.exists()){roomData=fresh.val();isHost=roomData.hostUid===uid;mode=roomData.mode||'2x4'}if(finish&&selected<4){selected++;renderRace();renderBoard()}else if(finish){$('board').classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector('[data-tab="board"]').classList.add('active');renderBoard()}else{renderRace();renderBoard()}}
async function reopen(){if(!isHost)return;await update(ref(db,`rooms/${roomId}/races/${selected}`),{finished:false})}
async function endGame(){if(!isHost)return;let n=[0,1,2,3,4].filter(i=>roomData?.races?.[i]?.finished).length;if(!n)return alert('최소 1개 레이스를 먼저 종료해주세요.');if(!confirm(`현재 ${n}개 레이스 결과로 경기를 종료할까요?`))return;await update(ref(db,'rooms/'+roomId),{gameFinished:true,gameFinishedAt:Date.now()});$('board').classList.remove('hidden');renderBoard()}
$('mode2').onclick=()=>{mode='2x4';$('mode2').classList.add('active');$('mode4').classList.remove('active')};$('mode4').onclick=()=>{mode='4x2';$('mode4').classList.add('active');$('mode2').classList.remove('active')};$('createBtn').onclick=create;$('joinBtn').onclick=()=>enter($('joinCode').value);$('savePractice').onclick=()=>savePractice(false);$('finishPractice').onclick=()=>{if(confirm('현재 입력된 연습경기 결과로 연습을 종료할까요?'))savePractice(true)};$('goRaceBtn').onclick=()=>{$('[data-tab="race"]').click()};
$('presetNames').onclick=presetNames;$('saveRace').onclick=()=>saveRace(false);$('finishRace').onclick=()=>saveRace(true);$('endGame').onclick=endGame;$('reopenRace').onclick=reopen;$('fastestLap').onchange=preview;$('finalBtn').onclick=renderFinal;$('pointsInfo').onclick=()=>$('pointsModal').classList.remove('hidden');$('closePoints').onclick=()=>$('pointsModal').classList.add('hidden');$('pointsModal').onclick=e=>{if(e.target.id==='pointsModal')$('pointsModal').classList.add('hidden')};document.addEventListener('input',e=>{if(e.target.matches('[data-rr]'))preview();if(e.target.matches('[data-pn]')){let i=e.target.dataset.pn;document.querySelectorAll(`[data-player-name=\"${i}\"]`).forEach(el=>el.textContent=e.target.value||`선수 ${Number(i)+1}`)}});
$('copyBtn').onclick=async()=>{let u=location.origin+location.pathname+'?room='+roomId;try{await navigator.clipboard.writeText(u);$('hostMsg').textContent='방 링크를 복사했습니다.'}catch{prompt('방 링크',u)}};$('showQrBtn').onclick=()=>{$('qrcode').innerHTML='';new QRCode($('qrcode'),{text:location.origin+location.pathname+'?room='+roomId,width:190,height:190});$('qrBox').classList.toggle('hidden')};$('leaveBtn').onclick=()=>{localStorage.removeItem('f1Room');location.href=location.pathname};$('resetBtn').onclick=async()=>{if(isHost&&confirm('모든 경기 데이터를 초기화할까요?'))await update(ref(db,'rooms/'+roomId),{players:empty(),practice:{},practiceFinished:false,races:{},gameFinished:false})};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$(b.dataset.tab).classList.remove('hidden');render()});
let initialRoom=new URLSearchParams(location.search).get('room')?.toUpperCase().trim()||'';let autoEntering=false;onAuthStateChanged(auth,u=>{uid=u?.uid||null;$('lobbyMsg').textContent=u?'Firebase 연결 완료':'Firebase 인증 대기 중…';if(u&&initialRoom&&!autoEntering){autoEntering=true;enter(initialRoom).catch(e=>{autoEntering=false;$('lobbyMsg').textContent='방 자동 입장 실패: '+(e?.message||'알 수 없는 오류')})}});signInAnonymously(auth).catch(e=>{$('lobbyMsg').textContent='Firebase 인증 실패: '+(e?.message||'알 수 없는 오류')+' (Firebase Console에서 익명 로그인을 확인해주세요.)'});if(!initialRoom){let saved=localStorage.getItem('f1Room');if(saved)setTimeout(()=>enter(saved),400)}
</script></body></html>
