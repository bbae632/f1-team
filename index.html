<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0f14"><title>🏎️ F1 8인 팀전</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#f5f7fb;background:#090b10}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#303747 0,#090b10 45%);min-height:100vh}
main{max-width:850px;margin:auto;padding:18px 14px 50px}h1{font-size:28px;margin:7px 0 18px}
.card{background:#171b24eF;border:1px solid #343b4b;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}
h2{font-size:20px;margin:3px 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
button,input{font:inherit;border-radius:11px;border:1px solid #4a5262;background:#222733;color:#fff;padding:11px 12px}
button{font-weight:800;cursor:pointer}button.primary{background:linear-gradient(135deg,#e10600,#ff4d3d);border-color:#e10600}button:disabled{opacity:.45;cursor:not-allowed}
button.danger{background:#7f2525;border-color:#9b3030}.hidden{display:none}.muted,.mini{color:#a9b1c0;font-size:13px}
.notice{padding:10px 12px;border-radius:10px;background:#222733;margin:8px 0}
.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1}.tabs .active{background:#fff;color:#111}
.room{font-size:31px;font-weight:900;letter-spacing:5px;text-align:center;padding:8px}
.qrbox{display:flex;justify-content:center;margin:12px 0}.qrbox>div{background:#fff;padding:10px;border-radius:12px}
.grid8{display:grid;grid-template-columns:1fr 65px 70px;gap:7px;align-items:center}.grid8 input{width:100%}
.teamA{color:#ff6868}.teamB{color:#72a5ff}.score{font-weight:900}
.race-list{display:grid;gap:8px;margin-bottom:12px}.race-card{background:#12161e;border:1px solid #343b4b;border-radius:13px;padding:12px;cursor:pointer}
.race-card.current{border-color:#e10600;box-shadow:0 0 0 1px #e1060055}.race-card.done{border-color:#397a59}
.race-head{display:flex;justify-content:space-between;font-weight:900}.badge{font-size:12px;border-radius:99px;padding:4px 8px;background:#333a48}.badge.done{background:#214e38;color:#baf2cf}.badge.wait{background:#303541}
.editor{border:1px solid #343b4b;border-radius:14px;padding:13px;background:#191e28}.editor h3{margin:0 0 10px}
.standings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teambox{padding:14px;border-radius:14px;background:#12161e}.teambox.a{border-left:4px solid #ff4d4d}.teambox.b{border-left:4px solid #5b91ff}
.big{font-size:30px;font-weight:900}.champion{padding:20px;text-align:center;border-radius:16px;background:linear-gradient(135deg,#472020,#171b24);border:1px solid #8e4040;margin-bottom:12px}.cup{font-size:45px}.winner{font-size:26px;font-weight:900}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px;font-size:14px}th,td{padding:8px 5px;border-bottom:1px solid #333;text-align:center}th{color:#aeb6c5}
.history{display:grid;gap:7px}.hist{padding:9px 10px;background:#12161e;border-radius:10px}
.info-btn{padding:6px 9px;border-radius:9px;font-size:12px;background:#292f3b}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.hidden{display:none}.modal-card{width:min(420px,100%);background:#181d27;border:1px solid #454d5e;border-radius:18px;padding:17px;box-shadow:0 20px 60px #0008}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0}.points-table{min-width:0;margin:12px 0}.points-table td,.points-table th{padding:8px}.points-table td:last-child{font-weight:900}
@media(max-width:520px){.standings{grid-template-columns:1fr}main{padding:12px 10px}}
</style></head><body><main>
<h1>🏎️ F1 8인 팀전</h1>
<section id="lobby" class="card"><h2>방 만들기 / 참가하기</h2><div class="row">
<button id="createBtn" class="primary">새 방 만들기</button><input id="joinCode" class="grow" maxlength="6" placeholder="방 코드 6자리"><button id="joinBtn">참가</button></div><div id="lobbyMsg" class="notice">Firebase 연결 중…</div></section>

<section id="roomView" class="hidden">
<div class="card"><div class="muted">방 코드</div><div id="roomCode" class="room">------</div>
<div id="qrBox" class="qrbox hidden"><div id="qrcode"></div></div><div class="row"><button id="showQrBtn">QR코드</button><button id="copyBtn">방 링크 복사</button><button id="leaveBtn">방 나가기</button></div><div id="hostMsg" class="notice"></div></div>
<div class="tabs"><button data-tab="practice" class="active">연습</button><button data-tab="race">레이스</button><button data-tab="board">점수판</button></div>

<section id="practice" class="tab"><div class="card"><h2>연습 게임</h2><p class="muted">연습 순위 1~8위를 입력하면 A=1·4·5·8위, B=2·3·6·7위로 자동 배정됩니다.</p>
<div class="grid8"><b>이름</b><b>순위</b><b>팀</b><div id="practiceRows" style="display:contents"></div></div>
<div class="row" style="margin-top:12px"><button id="savePractice" class="primary">연습 결과 저장</button></div></div></section>

<section id="race" class="tab hidden"><div class="card"><h2>🏁 본게임 · 5 Race</h2>
<p class="muted">종료하면 다음 레이스로 자동 이동합니다. 종료된 레이스는 다시 선택해 수정할 수 있습니다.</p>
<div id="raceList" class="race-list"></div>
<div class="editor"><div class="race-head"><h3 id="raceTitle">Race 1</h3><div class="row"><button id="pointsInfo" class="info-btn">ⓘ 점수</button><span id="raceBadge" class="badge wait">대기</span></div></div>
<div id="previous" class="notice"></div><div id="raceRows" class="grid8"></div>
<div class="row" style="margin-top:12px"><label><input id="fastestLap" type="checkbox"> 패스티스트랩 +1</label><button id="saveRace">결과 저장</button><button id="finishRace" class="primary">🏁 레이스 종료</button><button id="endGame" class="primary">🏆 경기 종료</button><button id="reopenRace">🔓 다시 열기</button></div></div></div></section>

<section id="board" class="tab hidden"><div class="card"><h2>🏆 실시간 점수판</h2><div id="champion"></div>
<div id="teams" class="standings"></div><div id="overall" class="tablewrap" style="margin-top:14px"></div></div>
<div class="card"><h2>📊 레이스별 결과</h2><div id="history" class="history"></div></div>
<div class="card"><button id="resetBtn" class="danger">방 데이터 초기화</button></div></section>
</section></main>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getDatabase,ref,set,onValue,get,update}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAnnKbcwMhahNIPgi4Kc-vlrjIjohTcMdg",authDomain:"f1-team-23439.firebaseapp.com",databaseURL:"https://f1-team-23439-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"f1-team-23439",storageBucket:"f1-team-23439.firebasestorage.app",messagingSenderId:"958691507990",appId:"1:958691507990:web:eb0fa15f924185f80d1a37",measurementId:"G-F2MG0RE5TW"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let uid=null,roomId=null,roomData=null,isHost=false,selected=0;
const pts=[25,18,15,12,10,8,6,4],$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const empty=()=>Array.from({length:8},()=>({name:"",rank:"",team:""}));
const norm=p=>Array.from({length:8},(_,i)=>({...empty()[i],...(Array.isArray(p)?p[i]:{})}));
const sorted=p=>[...norm(p)].sort((a,b)=>(Number(a.rank)||99)-(Number(b.rank)||99));
const team=r=>[1,4,5,8].includes(Number(r))?"A":[2,3,6,7].includes(Number(r))?"B":"";
function totals(){let t=Array(8).fill(0),p=norm(roomData?.players);for(const r of Object.values(roomData?.races||{})){for(let i=0;i<p.length;i++){let pos=Number(r.ranks?.[p[i].rank]);if(pos>=1&&pos<=8)t[i]+=pts[pos-1]+(r.fastestLap&&pos===1?1:0)}}return t}
function sortedTotals(p){let a=norm(roomData?.players),t=totals();return p.map(x=>{let i=a.findIndex(y=>y.name===x.name&&y.rank===x.rank);return i<0?0:t[i]})}
function summary(i,p){let r=roomData?.races?.[i];return r?.finished?p.map(x=>`${esc(x.name||"-")} ${r.ranks?.[x.rank]||"-"}위`).join(" · "):"미기록"}
function renderPractice(){let p=sorted(roomData?.players);$("practiceRows").innerHTML=p.map((x,i)=>`<input data-n="${i}" value="${esc(x.name)}" placeholder="${i+1}위 이름"><input data-r="${i}" type="number" min="1" max="8" value="${x.rank||""}"><b class="${x.team==="A"?"teamA":"teamB"}">${x.team||"-"}</b>`).join("")}
function renderRace(){
 let p=sorted(roomData?.players),rs=roomData?.races||{};
 $("raceList").innerHTML=Array.from({length:5},(_,i)=>{let done=!!rs[i]?.finished;return `<div class="race-card ${i===selected?"current ":""}${done?"done":""}" data-r="${i}"><div class="race-head"><span>Race ${i+1}</span><span class="badge ${done?"done":"wait"}">${done?"🏁 종료":i===selected?"진행 중":"대기"}</span></div>${done?`<div class="mini" style="margin-top:6px">${summary(i,p)}</div>`:""}</div>`}).join("");
document.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{selected=+e.dataset.r;renderRace()});
let r=rs[selected]||{};$("raceTitle").textContent=`Race ${selected+1}`;$("raceRows").innerHTML=p.map((x,i)=>`<div><b>${esc(x.name||"선수 "+(i+1))}</b><div class="mini">${x.team||"-"}</div></div><input data-rr="${i}" type="number" min="1" max="8" value="${r.ranks?.[x.rank]||""}" placeholder="순위"><div class="score" id="sc${i}">-</div>`).join("");
$("fastestLap").checked=!!r.fastestLap;let prev=selected?rs[selected-1]:null;
if(!selected){
 $("previous").innerHTML=`<div class="mini">첫 번째 레이스입니다. 이전 결과가 없습니다.</div>`;
}else if(prev?.finished){
 let prevRows=p.map(x=>{let pos=Number(prev.ranks?.[x.rank]);let point=pos>=1&&pos<=8?pts[pos-1]+(prev.fastestLap&&pos===1?1:0):0;return {x,pos,point}}).filter(q=>q.pos>=1&&q.pos<=8).sort((a,b)=>a.pos-b.pos).slice(0,3);
 $("previous").innerHTML=`<h4>이전 Race ${selected} TOP 3</h4><div class="history">${prevRows.map(q=>`<div class="hist"><b>${q.pos===1?"🥇":q.pos===2?"🥈":"🥉"} ${esc(q.x.name||"-")}</b>　<span class="${q.x.team==="A"?"teamA":"teamB"}">Team ${q.x.team||"-"}</span>　·　${q.point}점</div>`).join("")}</div>`;
}else{
 $("previous").innerHTML=`<div class="mini">이전 Race ${selected}가 아직 종료되지 않았습니다.</div>`;
}
preview();
preview();let done=!!r.finished;$("raceBadge").textContent=done?"🏁 종료":"진행 중";$("raceBadge").className="badge "+(done?"done":"wait");$("finishRace").disabled=!isHost||done;$("endGame").disabled=!isHost||!!roomData?.gameFinished;$("reopenRace").disabled=!isHost||!done;$("saveRace").disabled=!isHost||done;document.querySelectorAll("[data-rr]").forEach(e=>e.disabled=!isHost||done);$("fastestLap").disabled=!isHost||done}
function preview(){document.querySelectorAll("[data-rr]").forEach((e,i)=>{let r=+e.value;$("sc"+i).textContent=r>=1&&r<=8?pts[r-1]+($("fastestLap").checked&&r===1?1:0):"-"})}
function renderBoard(){
 let p=sorted(roomData?.players),t=sortedTotals(p),A=0,B=0;p.forEach((x,i)=>x.team==="A"?A+=t[i]:B+=t[i]);let all=[0,1,2,3,4].every(i=>roomData?.races?.[i]?.finished);
 let gameFinished=!!roomData?.gameFinished;
 $("champion").innerHTML=(all||gameFinished)?`<div class="champion"><div class="cup">🏆</div><div class="winner">${A>B?"TEAM A":B>A?"TEAM B":"무승부"} ${A===B?"":"우승!"}</div><b>${A} : ${B}</b></div>`:"";
 $("teams").innerHTML=`<div class="teambox a"><b class="teamA">TEAM A</b><div class="big">${A}</div><span class="mini">누적</span></div><div class="teambox b"><b class="teamB">TEAM B</b><div class="big">${B}</div><span class="mini">누적</span></div>`;
 let ranking=p.map((x,i)=>({x,total:t[i]})).sort((a,b)=>b.total-a.total);
 let heads=`<tr><th>순위</th><th>이름</th><th>팀</th>${[1,2,3,4,5].map(i=>`<th>R${i}</th>`).join("")}<th>총점</th></tr>`;
 let rows=ranking.map((q,ri)=>{let cells=[1,2,3,4,5].map(n=>{let r=roomData?.races?.[n-1],pos=r?.ranks?.[q.x.rank];return `<td>${r?.finished&&pos?(pts[pos-1]+(r.fastestLap&&+pos===1?1:0)):"-"}</td>`}).join("");return `<tr><td>${ri+1}</td><td>${esc(q.x.name||"-")}</td><td class="${q.x.team==="A"?"teamA":"teamB"}">${q.x.team||"-"}</td>${cells}<td><b>${q.total}</b></td></tr>`}).join("");
 $("overall").innerHTML=`<table><thead>${heads}</thead><tbody>${rows}</tbody></table>`;
 $("history").innerHTML=Array.from({length:5},(_,i)=>`<div class="hist"><b>Race ${i+1}</b>　${roomData?.races?.[i]?.finished?"🏁 종료":"대기"}<div class="mini">${summary(i,p)}</div></div>`).join("");
}
function render(){renderPractice();renderRace();renderBoard();$("hostMsg").textContent=isHost?"현재 기기: HOST (입력 가능)":"현재 기기: 참가자 (보기 전용)";$("savePractice").disabled=!isHost;$("resetBtn").disabled=!isHost}
async function enter(id){id=id.toUpperCase().trim();if(!/^[A-Z0-9]{6}$/.test(id))return $("lobbyMsg").textContent="6자리 방 코드를 확인해주세요.";let s=await get(ref(db,"rooms/"+id));if(!s.exists())return $("lobbyMsg").textContent="존재하지 않는 방입니다.";roomId=id;roomData=s.val();isHost=roomData.hostUid===uid;$("lobby").classList.add("hidden");$("roomView").classList.remove("hidden");$("roomCode").textContent=id;localStorage.setItem("f1Room",id);onValue(ref(db,"rooms/"+id),s=>{if(!s.exists())return location.reload();roomData=s.val();isHost=roomData.hostUid===uid;render()})}
async function create(){let id=Math.random().toString(36).slice(2,8).toUpperCase();while((await get(ref(db,"rooms/"+id))).exists())id=Math.random().toString(36).slice(2,8).toUpperCase();await set(ref(db,"rooms/"+id),{hostUid:uid,players:empty(),races:{},createdAt:Date.now()});enter(id)}
async function savePractice(){if(!isHost)return;let old=sorted(roomData.players),ns=[...document.querySelectorAll("[data-n]")],rs=[...document.querySelectorAll("[data-r]")],p=old.map((x,i)=>({name:ns[i].value.trim(),rank:+rs[i].value||"",team:team(rs[i].value)}));await update(ref(db,"rooms/"+roomId),{players:p})}
async function saveRace(finish=false){if(!isHost)return;let p=sorted(roomData.players),ins=[...document.querySelectorAll("[data-rr]")],nums=ins.map(x=>+x.value);if(finish&&(nums.some(n=>n<1||n>8)||new Set(nums).size!==8))return alert("1~8위를 중복 없이 모두 입력해주세요.");let ranks={};ins.forEach((x,i)=>{if(x.value)ranks[p[i].rank]=+x.value});await update(ref(db,"rooms/"+roomId),{["races/"+selected]:{ranks,fastestLap:$("fastestLap").checked,finished:finish,finishedAt:finish?Date.now():null}});if(finish&&selected<4){selected++;renderRace()}else if(finish){document.querySelector('[data-tab="board"]').click();renderBoard()}}
async function reopen(){if(!isHost||!roomData?.races?.[selected]?.finished)return;await update(ref(db,"rooms/"+roomId+"/races/"+selected),{finished:false})}
async function endGame(){
 if(!isHost)return;
 let finishedCount=[0,1,2,3,4].filter(i=>roomData?.races?.[i]?.finished).length;
 if(!finishedCount)return alert("최소 1개의 레이스 결과를 먼저 종료해주세요.");
 if(!confirm(`현재까지 ${finishedCount}개 레이스 결과로 경기를 종료하고 팀 우승을 확정할까요?`))return;
 await update(ref(db,"rooms/"+roomId),{gameFinished:true,gameFinishedAt:Date.now()});
 document.querySelector('[data-tab="board"]').click();
 renderBoard();
}
$("pointsInfo").onclick=()=>$("pointsModal").classList.remove("hidden");$("closePoints").onclick=()=>$("pointsModal").classList.add("hidden");$("pointsModal").onclick=e=>{if(e.target.id==="pointsModal")$("pointsModal").classList.add("hidden")};
$("createBtn").onclick=create;$("joinBtn").onclick=()=>enter($("joinCode").value);$("savePractice").onclick=savePractice;$("saveRace").onclick=()=>saveRace(false);$("finishRace").onclick=()=>saveRace(true);$("endGame").onclick=endGame;$("reopenRace").onclick=reopen;$("fastestLap").onchange=preview;document.addEventListener("input",e=>{if(e.target.matches("[data-rr]"))preview()});
$("copyBtn").onclick=async()=>{let u=location.origin+location.pathname+"?room="+roomId;try{await navigator.clipboard.writeText(u);$("hostMsg").textContent="방 링크를 복사했습니다."}catch{prompt("방 링크",u)}};$("showQrBtn").onclick=()=>{$("qrcode").innerHTML="";new QRCode($("qrcode"),{text:location.origin+location.pathname+"?room="+roomId,width:190,height:190});$("qrBox").classList.toggle("hidden")};$("leaveBtn").onclick=()=>{localStorage.removeItem("f1Room");location.href=location.pathname};$("resetBtn").onclick=async()=>{if(isHost&&confirm("모든 경기 데이터를 초기화할까요?"))await update(ref(db,"rooms/"+roomId),{players:empty(),races:{},gameFinished:false})};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));b.classList.add("active");$(b.dataset.tab).classList.remove("hidden");render()});
onAuthStateChanged(auth,u=>{uid=u?.uid||null;$("lobbyMsg").textContent=u?"Firebase 연결 완료":"로그인 중…"});signInAnonymously(auth).catch(e=>$("lobbyMsg").textContent="익명 로그인을 확인해주세요: "+e.message);
let initial=new URLSearchParams(location.search).get("room")||localStorage.getItem("f1Room");if(initial)setTimeout(()=>enter(initial),400);
</script></body></html>
