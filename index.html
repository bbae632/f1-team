const firebaseConfig={apiKey:"AIzaSyAnnKbcwMhahNIPgi4Kc-vlrjIjohTcMdg",authDomain:"f1-team-23439.firebaseapp.com",databaseURL:"https://f1-team-23439-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"f1-team-23439",storageBucket:"f1-team-23439.firebasestorage.app",messagingSenderId:"958691507990",appId:"1:958691507990:web:eb0fa15f924185f80d1a37",measurementId:"G-F2MG0RE5TW"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),pts=[25,18,15,12,10,8,6,4];let uid=null,roomId=null,roomData=null,isHost=false,selected=0,mode="2x4";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const empty=()=>Array.from({length:8},(_,i)=>({name:"선수 "+(i+1),team:""}));const players=()=>roomData?.players||empty();

function rankScore(r){return r>=1&&r<=8?pts[r-1]:0}

function renderPractice(){let n=practiceGames(),p=players(),finished=!!roomData?.practiceFinished;$("practiceGuide").textContent=finished?`연습 종료 · ${practiceCompletedGames()}경기 반영 / 총 ${n}경기 설정`: `선수 이름은 한 번만 입력합니다. 아래 각 연습경기의 순위에 같은 이름이 자동으로 표시됩니다. 누적점수로 1~8위를 결정합니다.`;let names=`<div class="practice-game"><h3>👤 선수 이름</h3><div class="grid8"><b>이름</b><b></b><b></b>${p.map((x,i)=>`<input data-pn="${i}" value="${esc(x.name)}" placeholder="이름"><span></span><span></span>`).join("")}</div></div>`;let games=Array.from({length:n},(_,g)=>{let r=roomData?.practice?.[g]?.ranks||{};return `<div class="practice-game"><h3>연습 ${g+1} / ${n}</h3><div class="grid8"><b>선수</b><b>순위</b><b>점수</b>${p.map((x,i)=>`<b class="practice-player-name" data-player-name="${i}">${esc(x.name||"선수 "+(i+1))}</b><input data-pr="${g}-${i}" type="number" min="1" max="8" value="${r[i]||""}" placeholder="순위"><b>${rankScore(Number(r[i]))||"-"}</b>`).join("")}</div></div>`}).join("");$("practiceArea").innerHTML=names+games;$("savePractice").disabled=!isHost||finished;$("finishPractice").disabled=!isHost||finished;document.querySelectorAll("[data-pr]").forEach(e=>e.disabled=!isHost||finished);document.querySelectorAll("[data-pn]").forEach(e=>e.disabled=!isHost||finished)}
function renderTeams(){let rank=finalPracticeRanking();let assigned=rank.map((q,i)=>({...q,team:teamForRank(i+1)}));let groups=teamNames().map(n=>({name:n,members:assigned.filter(x=>x.team===n)}));$("teamPreview").innerHTML=groups.map(g=>`<div class="teambox ${cls(g.name)}"><b class="${cls(g.name)}">${g.name}</b><div class="mini">${g.members.map(x=>esc(x.x.name)).join(" · ")||"아직 배정 전"}</div></div>`).join("")}
function renderRace(){let p=players(),rs=roomData?.races||{};$("raceList").innerHTML=Array.from({length:5},(_,i)=>{let done=!!rs[i]?.finished;return `<div class="race-card ${i===selected?"current ":""}${done?"done":""}" data-r="${i}"><div class="race-head"><span>Race ${i+1}</span><span class="badge ${done?"done":""}">${done?"🏁 종료":i===selected?"진행 중":"대기"}</span></div>${done?`<div class="mini" style="margin-top:5px">${summary(i)}</div>`:""}</div>`}).join("");document.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{selected=+e.dataset.r;renderRace()});let r=rs[selected]||{};$("raceTitle").textContent=`Race ${selected+1}`;$("raceRows").innerHTML=p.map((x,i)=>`<div><b>${esc(x.name||"선수 "+(i+1))}</b><div class="mini ${cls(x.team)}">${esc(x.team||"-")}</div></div><input data-rr="${i}" type="number" min="1" max="8" value="${r.ranks?.[i]||""}" placeholder="순위"><div class="score" id="sc${i}">-</div>`).join("");$("fastestLap").checked=!!r.fastestLap;let prev=selected?rs[selected-1]:null;if(!selected){$("previous").innerHTML=`<div class="mini">첫 번째 레이스입니다.</div>`}else if(prev?.finished){let top=Object.entries(prev.ranks||{}).map(([idx,pos])=>({i:Number(idx),pos:Number(pos)})).filter(q=>q.pos>=1&&q.pos<=8).sort((a,b)=>a.pos-b.pos).slice(0,3);$("previous").innerHTML=`<b>이전 Race ${selected} TOP 3</b><div class="history">${top.map(q=>{let x=p[q.i]||{};let team=x.team||"-";let score=rankScore(q.pos)+(prev.fastestLap&&q.pos===1?1:0);return `<div class="hist"><b>${q.pos===1?"🥇":q.pos===2?"🥈":"🥉"} ${esc(x.name||"선수 "+(q.i+1))}</b> <span class="${cls(team)}">[${esc(team)}]</span> · ${score}점</div>`}).join("")}</div>`}else{$("previous").innerHTML=`<div class="mini">이전 Race ${selected}가 아직 종료되지 않았습니다.</div>`}preview();let done=!!r.finished;$('raceBadge').textContent=done?'🏁 종료':'진행 중';$('raceBadge').className='badge '+(done?'done':'');$('finishRace').disabled=!isHost||done;$('endGame').disabled=!isHost||!!roomData?.gameFinished;$('reopenRace').disabled=!isHost||!done;$('saveRace').disabled=!isHost||done;document.querySelectorAll('[data-rr]').forEach(e=>e.disabled=!isHost||done);$('fastestLap').disabled=!isHost||done}

function summary(i){let r=roomData?.races?.[i],p=players();if(!r?.finished)return "미기록";return p.map((x,j)=>({x,pos:Number(r.ranks?.[j])})).filter(q=>q.pos).sort((a,b)=>a.pos-b.pos).slice(0,3).map(q=>`${q.pos}위 ${esc(q.x.name)} [${esc(q.x.team)}]`).join(" · ")}
function renderFinal(){let p=players(),t=totals(),groups=teamNames().map(n=>({name:n,members:p.map((x,i)=>({x,total:t[i]})).filter(q=>q.x.team===n),score:p.reduce((s,x,i)=>s+(x.team===n?t[i]:0),0)})).sort((a,b)=>b.score-a.score),ind=sortedIndividual();$("finalCard").classList.remove("hidden");$("finalCard").innerHTML=`<h2>🏁 F1 TEAM RACE · FINAL</h2><div class="final-sub">${mode==='2x4'?'2 TEAM × 4 PLAYERS':'4 TEAM × 2 PLAYERS'} · ${[0,1,2,3,4].filter(i=>roomData?.races?.[i]?.finished).length} RACES</div><div class="final-winner"><div class="cup">🏆</div><b>${groups[0].name}</b><div>${groups[0].score}점 · 우승</div></div><div class="final-teams">${groups.map((g,idx)=>`<div class="final-team"><h3 class="${cls(g.name)}">${idx===0?'🥇 ':''}${g.name}</h3><div class="pts">${g.score}점</div><ol>${g.members.sort((a,b)=>b.total-a.total).map(q=>`<li>${esc(q.x.name)} — ${q.total}점</li>`).join("")}</ol></div>`).join("")}</div><div class="final-individual"><b>개인 최종 순위</b>${ind.map((q,i)=>`<div><span>${i+1}. ${esc(q.x.name)} <span class="${cls(q.x.team)}">[${esc(q.x.team)}]</span></span><b>${q.total}</b></div>`).join("")}</div><div class="final-note">스크린샷용 최종 결과 화면 · F1 8인 팀전</div>`;$('finalCard').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){mode=roomData?.mode||'2x4';renderPractice();renderTeams();renderRace();renderBoard();$('roomInfo').textContent=`${mode==='2x4'?'2팀 × 4명 · Ferrari vs Red Bull':'4팀 × 2명 · Ferrari / Red Bull / McLaren / Mercedes'} · 연습 ${practiceGames()}경기`;$('hostMsg').textContent=isHost?'현재 기기: HOST (입력 가능)':'현재 기기: 참가자 (보기 전용)'}
async function enter(id){id=id.toUpperCase().trim();if(!/^[A-Z0-9]{6}$/.test(id))return $('lobbyMsg').textContent='6자리 방 코드를 확인해주세요.';let s=await get(ref(db,'rooms/'+id));if(!s.exists())return $('lobbyMsg').textContent='존재하지 않는 방입니다.';roomId=id;roomData=s.val();isHost=roomData.hostUid===uid;mode=roomData.mode||'2x4';$('lobby').classList.add('hidden');$('roomView').classList.remove('hidden');$('roomCode').textContent=id;localStorage.setItem('f1Room',id);onValue(ref(db,'rooms/'+id),s=>{if(!s.exists())return location.reload();roomData=s.val();isHost=roomData.hostUid===uid;render()})}
async function create(){let id=Math.random().toString(36).slice(2,8).toUpperCase();while((await get(ref(db,'rooms/'+id))).exists())id=Math.random().toString(36).slice(2,8).toUpperCase();let m=mode,c=Number($('practiceCount').value);await set(ref(db,'rooms/'+id),{hostUid:uid,mode:m,practiceCount:c,players:empty(),practice:{},races:{},gameFinished:false,createdAt:Date.now()});enter(id)}
async function savePractice(finish=false){if(!isHost||roomData?.practiceFinished)return;let p=players().map((x,i)=>({...x,name:document.querySelector(`[data-pn="${i}"]`)?.value.trim()||x.name}));let upd={players:p};let completed=0;for(let g=0;g<practiceGames();g++){let ranks={};for(let i=0;i<8;i++)ranks[i]=Number(document.querySelector(`[data-pr="${g}-${i}"]`)?.value)||'';let vals=Object.values(ranks);let hasAny=vals.some(x=>x>=1&&x<=8);if(hasAny&&(vals.some(x=>x<1||x>8)||new Set(vals).size!==8))return alert(`연습 ${g+1}의 1~8위를 중복 없이 모두 입력해주세요.`);if(vals.every(x=>x>=1&&x<=8)&&new Set(vals).size===8){upd[`practice/${g}/ranks`]=ranks;completed++}}if(!completed)return alert('최소 1개의 연습경기 결과를 입력해주세요.');if(!finish&&completed<practiceGames()){}let fake={...roomData,players:p,practice:{...(roomData.practice||{})}};for(let g=0;g<practiceGames();g++)if(upd[`practice/${g}/ranks`])fake.practice[g]={ranks:upd[`practice/${g}/ranks`]};roomData=fake;let rank=finalPracticeRanking();rank.forEach((q,i)=>{upd[`players/${q.i}/team`]=teamForRank(i+1)});if(finish)upd.practiceFinished=true;await update(ref(db,'rooms/'+roomId),upd);let fresh=await get(ref(db,'rooms/'+roomId));if(fresh.exists()){roomData=fresh.val();mode=roomData.mode||'2x4';isHost=roomData.hostUid===uid}render()}
async function saveRace(finish=false){if(!isHost)return;let currentPlayers=players();let ins=[...document.querySelectorAll('[data-rr]')],nums=ins.map(x=>+x.value);if(finish&&(nums.some(n=>n<1||n>8)||new Set(nums).size!==8))return alert('1~8위를 중복 없이 모두 입력해주세요.');let ranks={};ins.forEach((x,i)=>{if(x.value)ranks[i]=+x.value});await update(ref(db,`rooms/${roomId}`),{players:currentPlayers,[`races/${selected}`]:{ranks,fastestLap:$('fastestLap').checked,finished:finish,finishedAt:finish?Date.now():null}});let fresh=await get(ref(db,'rooms/'+roomId));if(fresh.exists()){roomData=fresh.val();isHost=roomData.hostUid===uid;mode=roomData.mode||'2x4'}if(finish&&selected<4){selected++;renderRace();renderBoard()}else if(finish){$('board').classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector('[data-tab="board"]').classList.add('active');renderBoard()}else{renderRace();renderBoard()}}
async function reopen(){if(!isHost)return;await update(ref(db,`rooms/${roomId}/races/${selected}`),{finished:false})}
async function endGame(){if(!isHost)return;let n=[0,1,2,3,4].filter(i=>roomData?.races?.[i]?.finished).length;if(!n)return alert('최소 1개 레이스를 먼저 종료해주세요.');if(!confirm(`현재 ${n}개 레이스 결과로 경기를 종료할까요?`))return;await update(ref(db,'rooms/'+roomId),{gameFinished:true,gameFinishedAt:Date.now()});$('board').classList.remove('hidden');renderBoard()}
$('mode2').onclick=()=>{mode='2x4';$('mode2').classList.add('active');$('mode4').classList.remove('active')};$('mode4').onclick=()=>{mode='4x2';$('mode4').classList.add('active');$('mode2').classList.remove('active')};$('createBtn').onclick=create;$('joinBtn').onclick=()=>enter($('joinCode').value);$('savePractice').onclick=()=>savePractice(false);$('finishPractice').onclick=()=>{if(confirm('현재 입력된 연습경기 결과로 연습을 종료할까요?'))savePractice(true)};$('saveRace').onclick=()=>saveRace(false);$('finishRace').onclick=()=>saveRace(true);$('endGame').onclick=endGame;$('reopenRace').onclick=reopen;$('fastestLap').onchange=preview;$('finalBtn').onclick=renderFinal;$('pointsInfo').onclick=()=>$('pointsModal').classList.remove('hidden');$('closePoints').onclick=()=>$('pointsModal').classList.add('hidden');$('pointsModal').onclick=e=>{if(e.target.id==='pointsModal')$('pointsModal').classList.add('hidden')};document.addEventListener('input',e=>{if(e.target.matches('[data-rr]'))preview();if(e.target.matches('[data-pn]')){let i=e.target.dataset.pn;document.querySelectorAll(`[data-player-name=\"${i}\"]`).forEach(el=>el.textContent=e.target.value||`선수 ${Number(i)+1}`)}});
$('copyBtn').onclick=async()=>{let u=location.origin+location.pathname+'?room='+roomId;try{await navigator.clipboard.writeText(u);$('hostMsg').textContent='방 링크를 복사했습니다.'}catch{prompt('방 링크',u)}};$('showQrBtn').onclick=()=>{$('qrcode').innerHTML='';new QRCode($('qrcode'),{text:location.origin+location.pathname+'?room='+roomId,width:190,height:190});$('qrBox').classList.toggle('hidden')};$('leaveBtn').onclick=()=>{localStorage.removeItem('f1Room');location.href=location.pathname};$('resetBtn').onclick=async()=>{if(isHost&&confirm('모든 경기 데이터를 초기화할까요?'))await update(ref(db,'rooms/'+roomId),{players:empty(),practice:{},practiceFinished:false,races:{},gameFinished:false})};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$(b.dataset.tab).classList.remove('hidden');render()});
onAuthStateChanged(auth,u=>{$('lobbyMsg').textContent=u?'Firebase 연결 완료':'Firebase 인증 대기 중…';uid=u?.uid||null});signInAnonymously(auth).catch(e=>{$('lobbyMsg').textContent='Firebase 인증 실패: '+(e?.message||'알 수 없는 오류')+' (Firebase Console에서 익명 로그인을 확인해주세요.)'});let initial=new URLSearchParams(location.search).get('room')||localStorage.getItem('f1Room');if(initial)setTimeout(()=>enter(initial),400);
</script></body></html>
